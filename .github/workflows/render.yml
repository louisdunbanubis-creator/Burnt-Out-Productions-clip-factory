name: Clip Factory - AI Best Moments

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "Where the video comes from"
        required: true
        type: choice
        options: [youtube, direct_mp4]
        default: youtube
      source_url:
        description: "YouTube link or direct MP4 file URL (not a webpage)"
        required: true
        type: string
      rights_confirmed:
        description: "I own/have permission/license or lawful rights to reuse this footage"
        required: true
        type: boolean
        default: false
      niche:
        description: "Niche used to score the best moments"
        required: true
        type: choice
        options: [cars, construction, podcasts, sports, interesting]
        default: cars
      max_clips:
        description: "Number of best moments to produce"
        required: true
        type: number
        default: 5
      target_duration:
        description: "Target total seconds for the finished montage"
        required: true
        type: number
        default: 45
      hook:
        description: "Optional custom headline; otherwise a hook is generated for each clip"
        required: false
        type: string
        default: ""
      narration_mode:
        description: "Original audio, generated voiceover, or mix"
        required: true
        type: choice
        options: [original, replace, mix]
        default: original

jobs:
  analyze-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Rights gate
        if: ${{ inputs.rights_confirmed != true }}
        run: |
          echo "::error::Rights confirmation is required."
          exit 1

      - uses: actions/checkout@v4

      - name: Install media tools, Whisper and brand font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu python3-venv
          sudo mkdir -p /usr/share/fonts/truetype/redthaproducer
          sudo cp public/fonts/RedthaProducer-Regular.ttf /usr/share/fonts/truetype/redthaproducer/RedthaProducer-Regular.ttf
          sudo fc-cache -f
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --no-cache-dir openai-whisper yt-dlp

      - name: Install Deno JavaScript runtime for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install free Piper voice engine when requested
        if: ${{ inputs.narration_mode == 'replace' || inputs.narration_mode == 'mix' }}
        run: |
          .venv/bin/pip install --no-cache-dir piper-tts
          mkdir -p work
          curl -L --fail --retry 3 -o work/en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          curl -L --fail --retry 3 -o work/en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json

      - name: Prepare normalized MP4 source
        id: media
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          mkdir -p work
          rm -f work/source.mp4 work/download.*
          cookie_args=()
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > work/youtube-cookies.txt
            chmod 600 work/youtube-cookies.txt
            cookie_args=(--cookies work/youtube-cookies.txt)
            trap 'rm -f work/youtube-cookies.txt' EXIT
          fi
          case "$SOURCE_TYPE" in
            direct_mp4)
              python3 - <<'PY'
          import os, urllib.parse, sys
          u = urllib.parse.urlparse(os.environ["SOURCE_URL"])
          if u.scheme != "https" or not u.netloc:
              print("Direct MP4 source must be an HTTPS URL.", file=sys.stderr)
              sys.exit(1)
          PY
              curl --location --fail --show-error --retry 3 --retry-all-errors --max-time 1800 --max-filesize 1800000000 "$SOURCE_URL" -o work/download.mp4
              ;;
            youtube)
              if ! .venv/bin/yt-dlp \
                --js-runtimes deno \
                --force-ipv4 \
                --no-playlist \
                --restrict-filenames \
                --retries 3 \
                --fragment-retries 3 \
                "${cookie_args[@]}" \
                -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b" \
                --merge-output-format mp4 \
                -o "work/download.%(ext)s" \
                "$SOURCE_URL"; then
                echo "::error::YouTube blocked this GitHub runner before MP4 preparation. Upload an MP4 in the Clip Factory hub, or configure the YOUTUBE_COOKIES_B64 repository secret with an authorized Netscape cookies file."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported source type."
              exit 1
              ;;
          esac
          INPUT="$(find work -maxdepth 1 -type f -name 'download.*' -print -quit)"
          if [ -z "$INPUT" ] || ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$INPUT" | grep -qx video; then
            echo "::error::Source preparation did not produce a readable video stream."
            exit 1
          fi
          if ! ffmpeg -y -v error -i "$INPUT" -map 0:v:0 -map 0:a:0? -c copy -movflags +faststart -f mp4 work/source.mp4; then
            echo "::notice::Source codecs require MP4-compatible transcoding."
            ffmpeg -y -v error -i "$INPUT" -map 0:v:0 -map 0:a:0? \
              -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart work/source.mp4
          fi
          DUR="$(ffprobe -v error -select_streams v:0 -show_entries format=duration -of default=nw=1:nk=1 work/source.mp4)"
          python3 - "$DUR" <<'PY'
          import math, sys
          try:
              duration = float(sys.argv[1])
          except ValueError:
              raise SystemExit("Normalized MP4 has no readable duration.")
          if not math.isfinite(duration) or duration <= 0:
              raise SystemExit("Normalized MP4 has an invalid duration.")
          PY
          echo "file=work/source.mp4" >> "$GITHUB_OUTPUT"
          echo "duration=$DUR" >> "$GITHUB_OUTPUT"

      - name: Extract full-video audio
        env:
          SOURCE_FILE: ${{ steps.media.outputs.file }}
        run: |
          ffmpeg -y -i "$SOURCE_FILE" -vn -ac 1 -ar 16000 -c:a pcm_s16le work/audio.wav

      - name: Transcribe the entire video
        run: |
          .venv/bin/whisper work/audio.wav --model base --language en --output_format json --output_dir work

      - name: Score moments and write clip scripts
        env:
          TRANSCRIPT_JSON: work/audio.json
          SOURCE_DURATION: ${{ steps.media.outputs.duration }}
          NICHE: ${{ inputs.niche }}
          MAX_CLIPS: ${{ inputs.max_clips }}
          TARGET_DURATION: ${{ inputs.target_duration }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/analyze.py

      - name: Render individual clips and stitched montage
        env:
          SOURCE_FILE: ${{ steps.media.outputs.file }}
          SOURCE_URL: ${{ inputs.source_url }}
          RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
          NICHE: ${{ inputs.niche }}
          HOOK: ${{ inputs.hook }}
          NARRATION_MODE: ${{ inputs.narration_mode }}
          PIPER_MODEL: work/en_US-lessac-medium.onnx
          ANALYSIS_FILE: work/analysis.json
          TRANSCRIPT_JSON: work/audio.json
          OUTPUT_FILE: output/best_moments_${{ inputs.niche }}.mp4
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python3 scripts/render.py

      - name: Prepare per-clip vidIQ keyword research queue
        env:
          ANALYSIS_FILE: work/analysis.json
          NICHE: ${{ inputs.niche }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python3 scripts/vidiq_research.py

      - name: Research clip keywords with official vidIQ MCP
        env:
          VIDIQ_MCP_API_KEY: ${{ secrets.VIDIQ_MCP_API_KEY }}
          VIDIQ_QUEUE_JSON: output/vidiq-research-queue.json
        run: |
          .venv/bin/python scripts/vidiq_mcp_research.py

      - name: Upload finished clips, scripts and analysis
        uses: actions/upload-artifact@v4
        with:
          name: clip-factory-${{ inputs.niche }}-best-moments
          path: output/
          retention-days: 3
